[package]
name = "neverliie-iced-widgets"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { path = "iced", features = ["default", "advanced", "image", "svg", "canvas"] }
num-traits = "0.2"
unicode-segmentation = "1.11"

# Native dependency of the `title_bar` widget. Used exclusively for the
# `WM_NCHITTEST` subclass that gives the custom title bar its Windows 11
# caption semantics; rounded corners and the undecorated shadow go through
# `window::Settings` instead.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace]
members = ["examples/*"]
exclude = ["iced"]
